name: Build Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test
        run: python app.py --smoke-test
      - name: Install builder
        run: python -m pip install PyInstaller==6.22.0
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SubtitleCleaner app.py
      - name: Packaged EXE smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\SubtitleCleaner.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'EXE startup timed out' }
          if ($process.ExitCode -ne 0) { throw "EXE startup failed: $($process.ExitCode)" }
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleCleaner-Windows
          path: dist/SubtitleCleaner.exe
          if-no-files-found: error
          retention-days: 30
